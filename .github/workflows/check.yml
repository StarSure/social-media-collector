name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:browser
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run check
      - run: npm run plan
      - run: node scripts/anonymous-homepage.mjs plan --spec examples/tiktok-videos-anonymous.json
      - run: node scripts/anonymous-homepage.mjs plan --spec examples/instagram-videos-anonymous.json
      - run: python3 scripts/package_skill.py --output dist/social-media-collector-0.3.0.zip
