<h1>社媒助手 · 本地运行</h1>
<p>你正在使用独立本地版本。这里的本地身份不对应原厂账户或会员。</p>
<ul>
<li>界面、普通采集、字段解析、任务历史和本地导出来自用户提供的 3.6.1 运行包；配置保存在该扩展本地。</li>
<li>真实采集需要打开对应平台页面；平台登录、验证码和签名环境仍由平台决定。</li>
<li>原厂高级动态脚本、云端会员、代管飞书令牌和公网模板分享不可用。</li>
<li>模板可在本地保存；跨浏览器迁移请在设置中使用配置导出/导入。飞书同步请配置自己的应用。</li>
</ul>
